[server]
# Multi-shot practice videos can be several hundred MB.
# Size in MB; must match MAX_UPLOAD_SIZE in backend/app/api/main.py.
maxUploadSize = 1024

[theme]
base = "dark"
primaryColor = "#FF8736"
backgroundColor = "#121212"
secondaryBackgroundColor = "#202020"
textColor = "#FAFAFA"
borderColor = "#333333"
linkColor = "#FF8736"
linkUnderline = true
grayTextColor = "#A3A3A3"
grayBackgroundColor = "#292929"
orangeColor = "#FF8736"
orangeTextColor = "#FF8736"
orangeBackgroundColor = "#33251D"
greenColor = "#4ADE80"
greenBackgroundColor = "#1C2E23"
greenTextColor = "#4ADE80"
redColor = "#F87171"
redBackgroundColor = "#332222"
redTextColor = "#F87171"
font = "sans-serif"
headingFontWeights = [750, 720, 680, 660, 660, 660]
baseRadius = "0.75rem"
buttonRadius = "0.65rem"
dataframeHeaderBackgroundColor = "#202020"
dataframeHeaderTextColor = "#FAFAFA"
chartCategoricalColors = ["#FF8736", "#4ADE80", "#F87171", "#A3A3A3"]
showWidgetBorder = true
showSidebarBorder = true
